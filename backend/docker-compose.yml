services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shendet
      POSTGRES_PASSWORD: shendet
      POSTGRES_DB: shendetplus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shendet -d shendetplus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shendet:shendet@db:5432/shendetplus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8000:8000"]

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shendet:shendet@db:5432/shendetplus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
